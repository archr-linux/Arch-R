[Unit]
# /var is a tmpfs, so a seed kept at the default path never survived a
# reboot. Keep it on /storage, which the initramfs mounts long before this.
RequiresMountsFor=/storage

[Service]
# The RK3326 has no hardware RNG the kernel can use, so the CRNG only
# became ready ~8s into boot, from jitter alone. Everything that asks
# for random bytes before that blocks: systemd-resolved sat in
# sysinit.target for 3s waiting on it, holding up the whole boot.
# Credit the seed saved on the previous boot so the CRNG is ready as soon
# as this unit runs. The seed is root-only, replaced on every boot, and
# the kernel keeps mixing its own entropy on top; the first boot after
# flashing has no seed and still waits.
Environment=SYSTEMD_RANDOM_SEED_CREDIT=1
ExecStartPre=/bin/mkdir -p /var/lib/systemd /storage/.cache/systemd
ExecStartPre=/bin/ln -sfn /storage/.cache/systemd/random-seed /var/lib/systemd/random-seed
