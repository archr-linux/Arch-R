d    /storage/.cache/iwd     0755 root root - -
d    /storage/.cache/iwd/ap  0755 root root - -

# /var is tmpfs; the symlink staged in the image is hidden at runtime.
# Keep an existing live state directory intact until the next boot.
L    /var/lib/iwd            - - - - /storage/.cache/iwd
