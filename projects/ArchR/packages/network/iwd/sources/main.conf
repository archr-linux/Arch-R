# use built-in dhcp client
[General]
EnableNetworkConfiguration=true
# EAPOL over legacy raw sockets, NOT nl80211 control port. The vendor
# FullMAC USB drivers we ship (AIC8800, RTL8851BU, RTL8188EU families)
# do not implement the nl80211 control port TX path, so with =true the
# 4-way handshake frames never reach the AP and every WPA2 connect
# times out as if the passphrase were wrong (issue #19, debugged live
# on Soysauce 2026-08-12: with =false the handshake completes at once).
ControlPortOverNL80211=false
UseDefaultInterface=true
AddressRandomization=disabled
AddressRandomizationRange=full

# The same vendor drivers advertise SAE via CMD_EXTERNAL_AUTH but never
# deliver the external auth events, so on WPA2/WPA3 transition APs iwd
# picks SAE and hangs forever ("FullMAC driver: usb using SAE. Expect
# EXTERNAL_AUTH" in the journal, then nothing). Disable SAE for them so
# iwd falls back to WPA2-PSK; "usb" catches drivers that don't even set
# a proper driver name (the AIC8800 reports literally "usb").
[DriverQuirks]
SaeDisable=usb,aic*,rtl88*,rtw_*,8851*

[Network]
RoutePriorityOffset=200

NameResolvingService=systemd
EnableIPv6=true

[Scan]
MaximumPeriodicScanInterval=30
