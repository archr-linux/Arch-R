# The NPU is used only by NPU upscale (npu-upscale): its launcher loads
# rknpu (modprobe, which a blacklist does not stop) when a game starts with
# it on, so a console that never turns it on never powers the NPU rail.
# As in dArkOS for the RG52 Mini (mamaich/dArkOS_rg52mini, npusr/).
blacklist rknpu
