# Keep the working set in RAM for at least 1 s before reclaiming it.
# Without this, a game or port that fills the 1 GB leaves the console
# thrashing on zram for minutes (it looks frozen; the systemd watchdog then
# resets it). With it, MGLRU calls the OOM killer, the largest process (the
# game that ran out of memory) is closed and the console keeps answering.
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
