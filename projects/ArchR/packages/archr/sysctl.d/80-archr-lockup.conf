# The lockup detectors (kernel 6.12.114-9): consoles froze to a black screen
# with nothing left behind. A CPU stuck in the kernel for 20 s (soft) or
# with interrupts off for 10 s (hard, buddy CPU check) now panics, pstore
# keeps the trace and the error report sends it. The boot command line has
# "nowatchdog", which leaves them off; this turns them on after boot.
# A task blocked over 120 s only warns (a slow card is not a freeze).
kernel.watchdog = 1
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.hung_task_panic = 0
