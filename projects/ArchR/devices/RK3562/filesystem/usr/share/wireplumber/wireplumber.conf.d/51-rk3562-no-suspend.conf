# RK3562 (AISLPC): the speaker amplifier pops whenever the codec path
# comes up or goes down, and WirePlumber suspends an idle ALSA output after
# 5 s; keep the outputs open, so it happens once, at boot.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
